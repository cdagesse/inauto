name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shape-valid build-time placeholders. src/env/server.ts validates at boot, so the
  # build needs syntactically valid values. Never real credentials.
  DATABASE_URL: postgres://postgres:ci-throwaway-not-a-secret@localhost:5432/inauto_ci
  DATABASE_URL_UNPOOLED: postgres://postgres:ci-throwaway-not-a-secret@localhost:5432/inauto_ci
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuaW5hdXRvLmxvY2FsJA
  CLERK_SECRET_KEY: sk_test_ci-placeholder
  IP_HASH_SALT: ci-placeholder-salt-not-a-real-value
  JOBS_DRY_RUN: "true"

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (zero warnings)
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  integration:
    name: Migrations and integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
          POSTGRES_DB: inauto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Seed catalog and fixture data
        run: pnpm db:seed
      - name: Integration tests
        run: pnpm test:integration

  migrate-production:
    name: Apply migrations to production database
    needs: [verify, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm db:migrate
